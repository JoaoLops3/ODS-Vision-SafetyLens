<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de Image Tracking  SafetyLens</title>
  <desc id="desc">Fluxo do usuário ao conteúdo ancorado nas letras A B C</desc>
  <rect width="780" height="420" fill="#F2F4F7"/>
  <text x="390" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F1B2D">Fluxo técnico de RA  Image Tracking</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F1B2D">
    <rect x="24" y="60" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#D5DBE3"/>
    <text x="94" y="85" text-anchor="middle">1. Abrir app</text>
    <text x="94" y="102" text-anchor="middle">ID + Abrir câmera</text>
    <path d="M164 88 H196" stroke="#5B6A7D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="196" y="60" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#D5DBE3"/>
    <text x="266" y="85" text-anchor="middle">2. ARSession</text>
    <text x="266" y="102" text-anchor="middle">feed da câmera</text>
    <path d="M336 88 H368" stroke="#5B6A7D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="368" y="60" width="160" height="56" rx="8" fill="#E6EFFD" stroke="#1A63D6"/>
    <text x="448" y="85" text-anchor="middle">3. Image Tracking</text>
    <text x="448" y="102" text-anchor="middle">busca o marcador</text>
    <path d="M528 88 H560" stroke="#5B6A7D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="560" y="60" width="196" height="56" rx="8" fill="#E3F4EC" stroke="#0F7A55"/>
    <text x="658" y="85" text-anchor="middle">4. Pose do ARTrackedImage</text>
    <text x="658" y="102" text-anchor="middle">inicia cronômetro (RF04)</text>

    <rect x="24" y="160" width="732" height="72" rx="8" fill="#FFF6D6" stroke="#FFC21A"/>
    <text x="390" y="190" text-anchor="middle" font-weight="700">5. Overlays filhos do marcador (UV A/B/C)</text>
    <text x="390" y="212" text-anchor="middle">A ’ HOT (placa) · B ’ PINCH (placa) · C ’ EPI (capacete 3D)</text>

    <rect x="24" y="260" width="230" height="64" rx="8" fill="#FFFFFF" stroke="#D5DBE3"/>
    <text x="139" y="288" text-anchor="middle">6. Toque no item ativo (RF03)</text>
    <text x="139" y="306" text-anchor="middle">seleção AR obrigatória</text>
    <path d="M254 292 H286" stroke="#5B6A7D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="286" y="260" width="230" height="64" rx="8" fill="#FFFFFF" stroke="#D5DBE3"/>
    <text x="401" y="288" text-anchor="middle">7. Confirmar item</text>
    <text x="401" y="306" text-anchor="middle">avança HOT ’ PINCH ’ EPI</text>
    <path d="M516 292 H548" stroke="#5B6A7D" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="548" y="260" width="208" height="64" rx="8" fill="#E3F4EC" stroke="#0F7A55"/>
    <text x="652" y="288" text-anchor="middle">8. Quiz + export</text>
    <text x="652" y="306" text-anchor="middle">JSON/CSV local (RF06)</text>

    <text x="390" y="380" text-anchor="middle" font-size="11" fill="#5B6A7D">Marcador físico recomendado: ~20 cm de largura (Assets/Markers/safetylens-equipment-target.png)</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5B6A7D"/>
    </marker>
  </defs>
</svg>
